name: Latest writing
# Keeps the "Latest writing" list in README.md in step with the blog's RSS feed.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://varuntx.us/rss.xml'
          max_post_count: 3
          commit_message: 'Update latest writing from varuntx.us'
